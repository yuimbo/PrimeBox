# launcher.conf — PrimeBox boot menu (/data/primebox/launcher.conf).
#   NAME | command      (empty command = Engine OS)
#   default = NAME      chosen when the countdown ends
#   timeout = SECONDS   0 = wait for input
default = ENGINE OS
timeout = 5

